<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>竹林七贤与荣启期 · 拼图游戏</title>
  <meta name="description" content="竹林七贤与荣启期错版拼砖画拼图游戏，支持鼠标、手指与摄像头手势三种操作方式" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-950: #05311a;
      --green-900: #074525;
      --green-800: #0b5a30;
      --green-700: #10753d;
      --green-600: #169148;
      --green-500: #2fb46a;
      --green-400: #4fd088;
      --green-300: #8eebae;
      --green-200: #c5f5d2;
      --green-100: #e3f8e8;
      --gold-700: #b8860b;
      --gold-500: #f2c14e;
      --gold-400: #ffd76e;
      --gold-300: #ffe9a6;
      --text: #f2fdf5;
      --muted: #b0cbb8;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(47, 180, 106, 0.18), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(242, 193, 78, 0.10), transparent 50%),
        var(--green-950);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Nav */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 4vw;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(7, 69, 37, 0.9), rgba(7, 69, 37, 0.4));
      border-bottom: 1px solid var(--glass-border);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      color: var(--green-200);
      text-decoration: none;
      font-size: 0.85rem;
      background: var(--glass);
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--green-100);
    }

    .page-title {
      font-family: "Noto Serif SC", "Source Han Serif SC", serif;
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      font-weight: 600;
      color: var(--green-100);
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .action-btn {
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--gold-500);
      background: rgba(242, 193, 78, 0.12);
      color: var(--green-100);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: rgba(242, 193, 78, 0.26);
      transform: translateY(-1px);
    }

    .action-btn.secondary {
      border-color: var(--green-500);
      background: rgba(47, 180, 106, 0.12);
    }

    .action-btn.secondary:hover {
      background: rgba(47, 180, 106, 0.26);
    }

    /* Layout */
    .puzzle-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 1.25rem;
      padding: 5.5rem 4vw 3rem;
      max-width: 1560px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .board-area {
      min-width: 0;
    }

    /* Right column: reference on top, progress pinned to bottom */
    .side-column {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-width: 0;
    }

    /* Reference panel */
    .reference-panel {
      padding: 0.9rem;
      border-radius: 14px;
      background: var(--glass);
      border: 1px solid rgba(242, 193, 78, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .reference-title {
      font-family: "Noto Serif SC", serif;
      font-size: 0.95rem;
      color: var(--gold-300);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .reference-img {
      width: 100%;
      border-radius: 8px;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .reference-tip {
      margin-top: 0.6rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .gesture-guide {
      margin-top: 0.7rem;
      padding-top: 0.6rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .gesture-guide strong {
      color: var(--green-200);
      font-weight: 500;
    }

    /* Progress panel */
    .progress-panel {
      margin-top: auto;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.65rem;
      font-family: "Noto Serif SC", serif;
      font-size: 0.9rem;
      color: var(--green-100);
    }

    .progress-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      color: var(--gold-300);
    }

    .progress-bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green-500), var(--gold-400));
      transition: width 0.4s ease;
    }

    /* Board */
    .board-wrap {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
    }

      .board {
        position: relative;
        width: 100%;
        aspect-ratio: 1600 / 1100;
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.45),
          inset 0 0 80px rgba(2, 20, 10, 0.5);
      }

    /* 拼图框左上角：手势说明 */
    .gesture-hints {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 50;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      background: rgba(2, 15, 9, 0.72);
      border: 1px solid rgba(255, 215, 110, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .gesture-hints h3 {
      font-family: "Noto Serif SC", serif;
      font-size: 0.8rem;
      color: var(--gold-300);
      margin-bottom: 0.4rem;
      letter-spacing: 0.06em;
    }

    .gesture-hints ul {
      list-style: none;
      font-size: 0.72rem;
      color: var(--green-200);
      line-height: 1.75;
    }

    .gesture-hints .g-name {
      color: var(--gold-400);
      font-weight: 600;
    }

    .gesture-hints .g-emoji {
      margin-right: 0.25rem;
    }

    .board-bg {
      position: absolute;
      inset: 0;
      background-image: url("assets/hero-combined.png");
      background-size: cover;
      background-position: center;
      opacity: 0.08;
      pointer-events: none;
    }

    .board-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(142, 235, 174, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(142, 235, 174, 0.06) 1px, transparent 1px);
      background-size: calc(100% / 5) calc(100% / 4);
      pointer-events: none;
    }

    .target-cell {
      position: absolute;
      border-radius: 6px;
      pointer-events: none;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .target-cell.active {
      z-index: 6;
      background: rgba(255, 215, 110, 0.16);
      box-shadow: inset 0 0 0 2px var(--gold-400), inset 0 0 26px rgba(255, 215, 110, 0.22);
    }

    .target-cell.hover {
      z-index: 6;
      background: rgba(142, 235, 174, 0.14);
      box-shadow: inset 0 0 0 2px rgba(142, 235, 174, 0.55);
    }

    /* Pieces */
    .piece {
      box-sizing: border-box;
      background-image: url("assets/hero-combined.png");
      background-repeat: no-repeat;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    }

    .board .piece {
      position: absolute;
      z-index: 3;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .board .piece:not(.dragging) {
      transition: left 0.14s ease, top 0.14s ease, box-shadow 0.15s ease;
    }

    .board .piece.dragging {
      z-index: 10;
      cursor: grabbing;
      border-color: var(--gold-400);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 26px rgba(255, 215, 110, 0.3);
    }

    .board .piece.placed {
      z-index: 1;
      pointer-events: none;
      border-color: rgba(142, 235, 174, 0.45);
      box-shadow: 0 0 0 1px rgba(142, 235, 174, 0.25);
      animation: placeFlash 0.5s ease;
    }

    @keyframes placeFlash {
      0% { box-shadow: 0 0 0 0 rgba(255, 215, 110, 0.85); }
      100% { box-shadow: 0 0 0 16px rgba(255, 215, 110, 0); }
    }

    /* Gesture UI */
    .video-preview {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      width: 220px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.5);
      z-index: 1500;
      display: none;
    }

    .video-preview.active {
      display: block;
    }

    .video-preview video,
    .video-preview canvas {
      display: block;
      width: 100%;
      transform: scaleX(-1);
    }

    .video-preview canvas {
      position: absolute;
      inset: 0;
      height: 100%;
    }

    .video-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.35rem 0.5rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: var(--green-200);
      background: rgba(2, 15, 9, 0.7);
      text-align: center;
      letter-spacing: 0.05em;
    }

    .virtual-cursor {
      position: fixed;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--gold-400);
      background: rgba(255, 215, 110, 0.12);
      box-shadow: 0 0 18px rgba(255, 215, 110, 0.35);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2200;
      display: none;
    }

    .virtual-cursor.active {
      display: block;
    }

    .gesture-status {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      transform: translateX(-50%);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: rgba(2, 15, 9, 0.75);
      border: 1px solid var(--glass-border);
      color: var(--green-200);
      font-size: 0.78rem;
      z-index: 1600;
      pointer-events: none;
    }

    /* Success */
    .success-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 15, 9, 0.75);
      backdrop-filter: blur(10px);
      z-index: 3000;
    }

    .success-overlay.show {
      display: flex;
    }

    .success-card {
      text-align: center;
      padding: 3rem 3.5rem;
      border-radius: 22px;
      background: rgba(7, 69, 37, 0.85);
      border: 1px solid rgba(242, 193, 78, 0.35);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.6);
      animation: successPop 0.5s ease;
    }

    @keyframes successPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-title {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--gold-300);
      margin-bottom: 0.75rem;
    }

    .success-text {
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .puzzle-layout {
        grid-template-columns: 1fr;
      }

      .reference-panel {
        width: 100%;
        max-width: 380px;
      }

      .progress-panel {
        width: 100%;
        max-width: 380px;
      }
    }

    @media (max-width: 640px) {
      .nav {
        flex-wrap: wrap;
        padding: 0.7rem 3vw;
      }

      .nav-actions {
        width: 100%;
        justify-content: flex-end;
      }

      .puzzle-layout {
        padding: 5rem 3vw 2rem;
      }

      .video-preview {
        width: 150px;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <a href="index.html" class="back-link">← 返回首页</a>
      <div class="page-title">竹林七贤与荣启期 · 拼图游戏</div>
    </div>
    <div class="nav-actions">
      <button id="gestureBtn" class="action-btn" type="button">开启手势控制</button>
      <button id="resetBtn" class="action-btn secondary" type="button">重新打乱</button>
    </div>
  </nav>

  <main class="puzzle-layout">
    <section class="board-area">
      <div class="board-wrap">
        <div id="board" class="board">
          <div class="board-bg"></div>
          <div class="board-grid"></div>
          <div id="targetCells"></div>
          <div id="boardPieces"></div>
          <!-- 拼图框左上角：三种手势说明 -->
          <div class="gesture-hints">
            <h3>手势操作说明</h3>
            <ul>
              <li><span class="g-emoji">☝️</span><span class="g-name">食指伸出</span>　选中目标碎片</li>
              <li><span class="g-emoji">🖐️</span><span class="g-name">五指张开</span>　碎片随手掌移动</li>
              <li><span class="g-emoji">✊</span><span class="g-name">握拳</span>　放下并嵌入碎片</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <aside class="side-column">
      <div class="reference-panel">
        <div class="reference-title">原图参考</div>
        <img src="assets/hero-combined.png" alt="竹林七贤与荣启期拼砖画原图" class="reference-img" />
        <p class="reference-tip">碎片已打乱铺满拼图框。拖动任意碎片可与其它碎片交换位置，放到正确位置即自动锁定。</p>
        <div class="gesture-guide">
          <strong>操作方式</strong><br />
          · 鼠标 / 手指：按住碎片拖到它的正确位置<br />
          · 手势：食指选中，张开手掌移动，握拳放下<br />
          <em style="opacity:.8">预览环境无摄像头时：点击"开启手势控制"自动进入鼠标手势模式（按下=选中 · 拖动=移动 · 松开=嵌入）。</em>
        </div>
      </div>

      <div class="progress-panel">
        <div class="progress-header">
          <span>拼图进度</span>
          <span id="progressCount" class="progress-count">0 / 20</span>
        </div>
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      </div>
    </aside>
  </main>

  <div id="virtualCursor" class="virtual-cursor"></div>
  <div id="gestureStatus" class="gesture-status">手势控制未开启</div>

  <div id="videoPreview" class="video-preview">
    <video id="inputVideo" autoplay muted playsinline></video>
    <canvas id="overlayCanvas"></canvas>
    <div id="videoLabel" class="video-label">等待手势…</div>
  </div>

  <div id="successOverlay" class="success-overlay">
    <div class="success-card">
      <h2 class="success-title">拼图成功</h2>
      <p class="success-text">你已完整复原《竹林七贤与荣启期》错版拼砖画。</p>
      <button id="againBtn" class="action-btn" type="button">再玩一次</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ====================== 基础配置 ====================== */
      const COLS = 5;
      const ROWS = 4;
      const TOTAL = COLS * ROWS;
      const EDGE_PADDING = 14;

      const board = document.getElementById('board');
      const boardPieces = document.getElementById('boardPieces');
      const targetCellsEl = document.getElementById('targetCells');
      const progressCount = document.getElementById('progressCount');
      const progressFill = document.getElementById('progressFill');
      const successOverlay = document.getElementById('successOverlay');
      const resetBtn = document.getElementById('resetBtn');
      const againBtn = document.getElementById('againBtn');
      const gestureStatus = document.getElementById('gestureStatus');

      let pieces = [];
      let placedCount = 0;
      let dragState = { piece: null, pointerId: null };

      /* ====================== 拼图初始化 ====================== */
      function createPieces() {
        pieces = [];
        boardPieces.innerHTML = '';
        targetCellsEl.innerHTML = '';
        placedCount = 0;

        // 1. 生成目标格子（仅用于高亮提示，不响应指针）
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const cell = document.createElement('div');
            cell.className = 'target-cell';
            cell.dataset.col = col;
            cell.dataset.row = row;
            cell.style.width = `calc(100% / ${COLS})`;
            cell.style.height = `calc(100% / ${ROWS})`;
            cell.style.left = `${(col * 100) / COLS}%`;
            cell.style.top = `${(row * 100) / ROWS}%`;
            targetCellsEl.appendChild(cell);
          }
        }

        // 2. 生成碎片，直接铺进拼图框内
        let index = 0;
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const el = document.createElement('div');
            el.className = 'piece';
            el.dataset.id = `piece-${index}`;
            el.title = `碎片 ${index + 1}`;
            el.style.backgroundSize = `${COLS * 100}% ${ROWS * 100}%`;
            el.style.backgroundPosition = `${(col / (COLS - 1)) * 100}% ${(row / (ROWS - 1)) * 100}%`;
            el.addEventListener('pointerdown', onPiecePointerDown);
            boardPieces.appendChild(el);
            pieces.push({
              id: `piece-${index}`,
              col,
              row,
              curCol: col,
              curRow: row,
              placed: false,
              element: el
            });
            index++;
          }
        }

        // 3. 打乱：随机铺位，并保证开局没有任何碎片在正确位置
        const cells = [];
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) cells.push({ col, row });
        }
        let perm;
        do {
          perm = shuffle(cells.slice());
        } while (perm.some((c, i) => c.col === pieces[i].col && c.row === pieces[i].row));
        pieces.forEach((p, i) => setPieceCell(p, perm[i].col, perm[i].row));

        updateProgress();
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function setPieceCell(piece, col, row) {
        piece.curCol = col;
        piece.curRow = row;
        piece.element.style.width = `calc(100% / ${COLS})`;
        piece.element.style.height = `calc(100% / ${ROWS})`;
        piece.element.style.left = `${(col * 100) / COLS}%`;
        piece.element.style.top = `${(row * 100) / ROWS}%`;
      }

      function findPieceById(id) {
        return pieces.find(p => p.id === id);
      }

      function cellEl(col, row) {
        return targetCellsEl.querySelector(
          `.target-cell[data-col="${col}"][data-row="${row}"]`
        );
      }

      function pieceAt(col, row) {
        return pieces.find(
          p => p !== dragState.piece && p.curCol === col && p.curRow === row
        );
      }

      function hitCell(x, y) {
        const r = board.getBoundingClientRect();
        if (x < r.left - EDGE_PADDING || x > r.right + EDGE_PADDING) return null;
        if (y < r.top - EDGE_PADDING || y > r.bottom + EDGE_PADDING) return null;
        const col = Math.max(0, Math.min(COLS - 1, Math.floor((x - r.left) / (r.width / COLS))));
        const row = Math.max(0, Math.min(ROWS - 1, Math.floor((y - r.top) / (r.height / ROWS))));
        return { col, row };
      }

      function clearHover() {
        targetCellsEl
          .querySelectorAll('.target-cell.hover')
          .forEach(el => el.classList.remove('hover'));
      }

      /* ====================== 鼠标 / 触屏拖拽 ====================== */
      function onPiecePointerDown(e) {
        if (e.button !== undefined && e.button !== 0) return;
        const piece = findPieceById(e.currentTarget.dataset.id);
        if (!piece || piece.placed) return;

        e.preventDefault();
        startDrag(piece, e.clientX, e.clientY);
        dragState.pointerId = e.pointerId;

        window.addEventListener('pointermove', onWindowPointerMove);
        window.addEventListener('pointerup', onWindowPointerUp);
        window.addEventListener('pointercancel', onWindowPointerUp);
      }

      function startDrag(piece, x, y) {
        if (dragState.piece) return;
        dragState.piece = piece;
        piece.element.classList.add('dragging');
        const target = cellEl(piece.col, piece.row);
        if (target) target.classList.add('active');
        moveDrag(x, y);
      }

      function moveDrag(x, y) {
        const piece = dragState.piece;
        if (!piece) return;
        const r = board.getBoundingClientRect();
        const cellW = r.width / COLS;
        const cellH = r.height / ROWS;
        let left = x - r.left - cellW / 2;
        let top = y - r.top - cellH / 2;
        left = Math.max(0, Math.min(r.width - cellW, left));
        top = Math.max(0, Math.min(r.height - cellH, top));
        piece.element.style.left = `${left}px`;
        piece.element.style.top = `${top}px`;

        clearHover();
        const cell = hitCell(x, y);
        if (cell && !(cell.col === piece.col && cell.row === piece.row)) {
          const el = cellEl(cell.col, cell.row);
          if (el) el.classList.add('hover');
        }
      }

      function onWindowPointerMove(e) {
        if (dragState.piece) moveDrag(e.clientX, e.clientY);
      }

      function onWindowPointerUp(e) {
        if (!dragState.piece) return;
        endDrag(e.clientX, e.clientY);
        window.removeEventListener('pointermove', onWindowPointerMove);
        window.removeEventListener('pointerup', onWindowPointerUp);
        window.removeEventListener('pointercancel', onWindowPointerUp);
      }

      function endDrag(x, y) {
        const piece = dragState.piece;
        if (!piece) return;

        const target = cellEl(piece.col, piece.row);
        if (target) target.classList.remove('active');
        clearHover();

        piece.element.classList.remove('dragging');
        const cell = hitCell(x, y);
        let moved = false;
        if (cell) {
          const occupant = pieceAt(cell.col, cell.row);
          if (!occupant) {
            // 空位：直接放入
            setPieceCell(piece, cell.col, cell.row);
            moved = true;
          } else if (!occupant.placed) {
            // 与该位置的碎片交换
            const origin = { col: piece.curCol, row: piece.curRow };
            setPieceCell(piece, cell.col, cell.row);
            setPieceCell(occupant, origin.col, origin.row);
            tryLock(occupant);
            moved = true;
          }
          // 若该位置已锁定碎片，则本次拖动无效
        }
        if (!moved) setPieceCell(piece, piece.curCol, piece.curRow);

        tryLock(piece);
        dragState.piece = null;
        dragState.pointerId = null;
        updateProgress();

        if (placedCount === TOTAL) {
          setTimeout(showSuccess, 400);
        }
      }

      function tryLock(piece) {
        if (piece.placed) return;
        if (piece.curCol !== piece.col || piece.curRow !== piece.row) return;
        piece.placed = true;
        placedCount++;
        piece.element.classList.remove('dragging');
        piece.element.classList.add('placed');
      }

      function updateProgress() {
        progressCount.textContent = `${placedCount} / ${TOTAL}`;
        progressFill.style.width = `${(placedCount / TOTAL) * 100}%`;
      }

      function showSuccess() {
        successOverlay.classList.add('show');
      }

      function resetGame() {
        successOverlay.classList.remove('show');
        createPieces();
      }

      resetBtn.addEventListener('click', resetGame);
      againBtn.addEventListener('click', resetGame);

      /* ====================== 供手势模块调用的接口 ====================== */
      function trySelectPieceAt(x, y) {
        if (dragState.piece) return;
        const el = document.elementFromPoint(x, y);
        if (!el || !el.closest) return;
        const pieceEl = el.closest('.piece');
        if (!pieceEl) return;
        const piece = findPieceById(pieceEl.dataset.id);
        if (!piece || piece.placed) return;
        startDrag(piece, x, y);
      }

      window.PuzzleDrag = {
        selectAt: trySelectPieceAt,
        moveAt: function (x, y) {
          if (dragState.piece) moveDrag(x, y);
        },
        dropAt: function (x, y) {
          if (dragState.piece) endDrag(x, y);
        },
        cancel: function () {
          if (dragState.piece) endDrag(-9999, -9999);
        }
      };

      /* ====================== 启动 ====================== */
      createPieces();

      // 手势模块兜底提示（本地资源加载失败时）
      setTimeout(function () {
        if (!window.__gestureModuleLoaded) {
          gestureStatus.textContent = '手势模块脚本未加载，请刷新页面重试';
        }
      }, 5000);
    })();
  </script>

  <script type="module">
    /* ====================== MediaPipe Tasks Vision 手势控制（全本地化，无需网络） ====================== */
    // 所有资源均本地化，运行期不依赖任何 CDN
    const VISION_LOCAL = './assets/mediapipe/vision_bundle.mjs';
    const WASM_LOCAL   = './assets/mediapipe/wasm';
    const MODEL_LOCAL  = 'assets/hand_landmarker.task';

    window.__gestureModuleLoaded = true;
    window.__gestureModelStatus = 'idle';

    const gestureBtn = document.getElementById('gestureBtn');
    const gestureStatus = document.getElementById('gestureStatus');
    const videoPreview = document.getElementById('videoPreview');
    const videoLabel = document.getElementById('videoLabel');
    const inputVideo = document.getElementById('inputVideo');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const virtualCursor = document.getElementById('virtualCursor');

    let HandLandmarkerRef = null;
    let DrawingUtilsRef = null;
    let HAND_CONNECTIONS = null;
    let handLandmarker = null;
    let visionModule = null;
    let stream = null;
    let running = false;
    let lastVideoTime = -1;
    let gestureBuffer = [];
    // 'camera' | 'mouse' | null —— 手势通道
    let gestureMode = null;

    gestureBtn.addEventListener('click', function () {
      if (running) {
        stopGesture();
      } else {
        startGesture();
      }
    });

    async function loadVisionModule() {
      if (visionModule) return visionModule;
      visionModule = await import(VISION_LOCAL);
      return visionModule;
    }

    /* ---- 鼠标手势回退通道：摄像头不可用时（file://、嵌入预览等）自动启用 ---- */
    function startMouseGestureMode(reason) {
      gestureMode = 'mouse';
      running = true;
      virtualCursor.classList.add('active');
      gestureBtn.textContent = '关闭手势控制';
      gestureBtn.disabled = false;
      const msg = reason
        ? '鼠标手势模式已激活（' + reason + '）。操作：按下=食指选中 · 拖动=手掌移动 · 松开=握拳嵌入'
        : '鼠标手势模式已激活。操作：按下=食指选中 · 拖动=手掌移动 · 松开=握拳嵌入';
      gestureStatus.textContent = msg;
      // 虚拟光标跟随鼠标
      document.addEventListener('mousemove', onMouseMoveVirtual);
    }

    function onMouseMoveVirtual(e) {
      virtualCursor.style.left = e.clientX + 'px';
      virtualCursor.style.top = e.clientY + 'px';
    }

    function canUseCamera() {
      return location.protocol !== 'file:'
        && navigator.mediaDevices
        && typeof navigator.mediaDevices.getUserMedia === 'function';
    }

    async function startGesture() {
      if (running) return;
      window.__gestureModelStatus = 'loading';

      // 摄像头不可用 → 直接走鼠标手势回退通道（内置预览 / file:// 环境）
      if (!canUseCamera()) {
        startMouseGestureMode(location.protocol === 'file:' ? '摄像头需在 HTTP 环境' : '摄像头不可用');
        return;
      }

      try {
        gestureBtn.textContent = '加载手势模型…';
        gestureBtn.disabled = true;
        gestureStatus.textContent = '正在检查运行环境…';

        gestureStatus.textContent = '正在加载本地手势模型…';
        if (!handLandmarker) {
          const vision = await loadVisionModule();
          HandLandmarkerRef = vision.HandLandmarker;
          DrawingUtilsRef = vision.DrawingUtils;
          HAND_CONNECTIONS = vision.HandLandmarker.HAND_CONNECTIONS;

          gestureStatus.textContent = '正在初始化手势模型（本地推理引擎）…';
          const fileset = await vision.FilesetResolver.forVisionTasks(WASM_LOCAL);

          const create = function (delegate) {
            return HandLandmarkerRef.createFromOptions(fileset, {
              baseOptions: {
                modelAssetPath: MODEL_LOCAL,
                delegate: delegate
              },
              runningMode: 'VIDEO',
              numHands: 1,
              minHandDetectionConfidence: 0.6,
              minTrackingConfidence: 0.6
            });
          };
          let created = null;
          try {
            created = await create('GPU');
          } catch (gpuErr) {
            console.warn('GPU 推理不可用，回退到 CPU：', gpuErr);
            created = await create('CPU');
          }
          handLandmarker = created;
          window.__gestureModelStatus = 'ok';
        }

        gestureStatus.textContent = '正在开启摄像头…';
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: 'user' },
          audio: false
        });
        inputVideo.srcObject = stream;
        inputVideo.onerror = function () {
          console.error('视频流播放失败');
        };
        await inputVideo.play();

        gestureMode = 'camera';
        videoPreview.classList.add('active');
        virtualCursor.classList.add('active');
        running = true;
        lastVideoTime = -1;
        gestureBtn.textContent = '关闭手势控制';
        gestureBtn.disabled = false;
        gestureStatus.textContent = '手势控制已开启（摄像头模式）';
        requestAnimationFrame(loop);
      } catch (err) {
        console.error('手势开启失败，回退到鼠标手势模式：', err);
        // 清理摄像头残留
        if (stream) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          stream = null;
        }
        inputVideo.srcObject = null;
        videoPreview.classList.remove('active');

        // 摄像头失败 → 回退到鼠标手势模式，保证始终可用
        startMouseGestureMode('摄像头不可用');
        return;
      } finally {
        if (!running) gestureBtn.disabled = false;
      }
    }

    async function stopGesture() {
      running = false;
      gestureMode = null;
      gestureBtn.textContent = '开启手势控制';
      gestureBtn.disabled = false;
      videoPreview.classList.remove('active');
      virtualCursor.classList.remove('active');
      gestureStatus.textContent = '手势控制未开启';
      videoLabel.textContent = '等待手势…';
      document.removeEventListener('mousemove', onMouseMoveVirtual);
      if (window.PuzzleDrag) window.PuzzleDrag.cancel();
      if (stream) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        stream = null;
      }
      inputVideo.srcObject = null;
      gestureBuffer = [];
      lastVideoTime = -1;
      window.__gestureModelStatus = 'idle';
    }

    function loop() {
      if (!running || !handLandmarker) return;
      if (inputVideo.readyState >= 2 && inputVideo.currentTime !== lastVideoTime) {
        lastVideoTime = inputVideo.currentTime;
        try {
          const results = handLandmarker.detectForVideo(inputVideo, performance.now());
          handleResults(results);
        } catch (e) {
          console.warn(e);
        }
      }
      requestAnimationFrame(loop);
    }

    function handleResults(results) {
      const w = inputVideo.videoWidth || 640;
      const h = inputVideo.videoHeight || 480;
      if (overlayCanvas.width !== w) overlayCanvas.width = w;
      if (overlayCanvas.height !== h) overlayCanvas.height = h;
      const ctx = overlayCanvas.getContext('2d');
      ctx.clearRect(0, 0, w, h);

      const lms = results && results.landmarks;
      if (!lms || lms.length === 0) {
        videoLabel.textContent = '未检测到手';
        return;
      }

      const lm = lms[0];

      // 绘制手部骨架
      if (DrawingUtilsRef && HAND_CONNECTIONS) {
        const du = new DrawingUtilsRef(ctx);
        du.drawConnectors(lm, HAND_CONNECTIONS, {
          color: '#8eebae',
          lineWidth: 2
        });
        du.drawLandmarks(lm, { color: '#ffd76e', lineWidth: 1, radius: 3 });
      }

      const gesture = smoothGesture(detectGesture(lm));
      if (!gesture) {
        videoLabel.textContent = '等待手势…';
        return;
      }

      // 食指用指尖，其余手势用手掌中心
      const pt = gesture === 'index' ? lm[8] : lm[9];
      const x = (1 - pt.x) * window.innerWidth;
      const y = pt.y * window.innerHeight;
      virtualCursor.style.left = x + 'px';
      virtualCursor.style.top = y + 'px';

      const api = window.PuzzleDrag;
      if (api) {
        if (gesture === 'index') {
          api.selectAt(x, y);
        } else if (gesture === 'palm') {
          api.moveAt(x, y);
        } else if (gesture === 'fist') {
          api.dropAt(x, y);
        }
      }

      videoLabel.textContent =
        gesture === 'index' ? '食指：选中碎片'
        : gesture === 'palm' ? '手掌：移动碎片'
        : '握拳：放下碎片';
    }

    /* ====================== 手势判定 ====================== */
    function detectGesture(lm) {
      const index = isFingerExtended(lm, 8, 6, 5);
      const middle = isFingerExtended(lm, 12, 10, 9);
      const ring = isFingerExtended(lm, 16, 14, 13);
      const pinky = isFingerExtended(lm, 20, 18, 17);

      if (index && !middle && !ring && !pinky) return 'index'; // 仅食指伸开：选中
      if (index && middle && ring && pinky) return 'palm';     // 四指张开：移动
      if (!index && !middle && !ring && !pinky) return 'fist'; // 握拳：放下
      return null;
    }

    function isFingerExtended(lm, tipIdx, pipIdx, mcpIdx) {
      const wrist = lm[0];
      const tip = dist(lm[tipIdx], wrist);
      const pip = dist(lm[pipIdx], wrist);
      const mcp = dist(lm[mcpIdx], wrist);
      return tip > pip * 1.12 && pip >= mcp * 0.95;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // 最近 5 帧多数投票，消除抖动
    function smoothGesture(g) {
      gestureBuffer.push(g);
      if (gestureBuffer.length > 5) gestureBuffer.shift();
      const counts = {};
      gestureBuffer.forEach(function (x) {
        if (x) counts[x] = (counts[x] || 0) + 1;
      });
      let best = null;
      let max = 0;
      for (const k in counts) {
        if (counts[k] > max) {
          max = counts[k];
          best = k;
        }
      }
      return max >= 3 ? best : null;
    }
  </script>
